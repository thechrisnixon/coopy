# pnpm 11 reads project settings from this file, not the "pnpm" field in
# package.json.

# Which dependencies may run install scripts:
# - esbuild links a native binary and needs its install script to run.
# - Astryx ships prebuilt dist output; its postinstall scripts only print setup
#   notices, so skipping them keeps installs deterministic here and on Vercel.
allowBuilds:
  esbuild: true
  '@astryxdesign/cli': false
  '@astryxdesign/core': false

# Don't fail the build over the skipped-scripts notice above — the decision is
# already recorded, and the pre-script install check just re-reports it.
strictDepBuilds: false
verifyDepsBeforeRun: false
