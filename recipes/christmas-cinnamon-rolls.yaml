name: Christmas Cinnamon Rolls
serves: 9
tags: [breakfast, baking, contains-dairy, special, holiday]

time:
  prep: 2h
  cook: 20m
  total: 2h 20m

sources:
  a:
    name: Ambitious Kitchen — The Best Cinnamon Rolls You'll Ever Eat
    url: https://www.ambitiouskitchen.com/best-cinnamon-rolls/
    role: the whole recipe — enriched bread-flour dough, dark brown sugar filling, cream cheese frosting

ingredients:
  - group: Dough
    qty: ¾
    unit: cup
    item: milk (whole or 2%), 180 g
  - group: Dough
    qty: 2 ¼
    unit: teaspoons
    item: quick-rise (instant) or active dry yeast (one ¼-ounce package)
  - group: Dough
    qty: ¼
    unit: cup
    item: granulated sugar (50 g)
  - group: Dough
    qty: 4
    unit: tablespoons
    item: salted butter, melted and cooled (57 g)
  - group: Dough
    qty: 1
    unit: large
    item: egg, room temperature
    discrete: true
  - group: Dough
    qty: 1
    unit: large
    item: egg yolk, room temperature
    discrete: true
  - group: Dough
    qty: 3
    unit: cups
    item: bread flour (360 g), plus more as needed
  - group: Dough
    qty: ¾
    unit: teaspoon
    item: kosher salt
  - group: Dough
    item: extra-virgin olive oil, for greasing the bowl

  - group: Filling
    qty: 4
    unit: tablespoons
    item: salted butter, softened (57 g)
  - group: Filling
    qty: ⅔
    unit: cup
    item: packed dark brown sugar (142 g)
  - group: Filling
    qty: 1 ½
    unit: tablespoons
    item: ground cinnamon

  - group: Cream cheese frosting
    qty: 4
    unit: oz
    item: cream cheese, softened (112 g)
  - group: Cream cheese frosting
    qty: ¾
    unit: cup
    item: powdered sugar (85 g)
  - group: Cream cheese frosting
    qty: 3
    unit: tablespoons
    item: salted butter, softened
  - group: Cream cheese frosting
    qty: ½
    unit: teaspoon
    item: vanilla extract

steps:
  - >-
    Warm the milk to 115°F (45 seconds to 1 minute in the microwave) and pour it
    into a stand mixer bowl fitted with the paddle. Sprinkle the yeast over, add
    the sugar, melted butter, egg and yolk, and mix on medium for 30 seconds.
  - >-
    Stir in the flour and salt with a wooden spoon until a dough forms. Switch to
    the dough hook and knead on medium 8–10 minutes until soft and slightly
    sticky, adding flour a tablespoon at a time only if needed.
  - >-
    Move the dough to an oiled bowl, cover with plastic wrap and a warm towel, and
    let it double, 1–1½ hours.
  - >-
    On a well-floured surface, roll it to a 10 × 14-inch rectangle. Spread with the
    softened butter, leaving a ¼-inch strip bare along one short side. Mix the
    brown sugar and cinnamon, scatter it over, and rub it gently into the butter.
  - >-
    Roll up tightly from the other short side and pinch the seam closed. Seam side
    down, trim ½ inch off each end and nudge the ends in to compact the log. Cut
    into nine 1-inch rolls with floss or a serrated knife.
  - >-
    Set the rolls in a parchment-lined 9 × 9 or 11 × 7-inch pan, cover, and let
    rise until doubled and touching, 45 minutes to 1 hour. Heat the oven to 350°F.
  - Bake uncovered until golden at the edges, 20–25 minutes. Cool 10 minutes.
  - >-
    Beat the cream cheese, powdered sugar, butter and vanilla on low for 30
    seconds, then medium-high 1–2 minutes until fluffy. Spread over the warm rolls.

notes: |
  Our Christmas morning cinnamon rolls. Makes 9 large rolls.

  Start early — there's about 2 hours of rising before they bake.
