name: Easy Asian Dumpling Soup
serves: 4
tags: [dinner, soup]

time:
  prep: 5m
  cook: 15m
  total: 20m

sources:
  a:
    name: Hello Little Home — Easy Asian Dumpling Soup
    url: https://hellolittlehome.com/motivation-monday-getting-enough-sleep-easy-asian-dumpling-soup-recipe/
    role: the whole recipe — store-bought dumplings in a quick vegetable broth

ingredients:
  - qty: 6
    unit: cups
    item: vegetable broth
  - qty: 1
    unit: large
    item: carrot, peeled and thinly sliced
  - qty: ¼
    unit: head
    item: cabbage, chopped
  - qty: 1
    unit: tablespoon
    item: soy sauce
  - qty: 1
    unit: teaspoon
    item: sesame oil
  - item: sriracha sauce, to taste
    note: added at the table, after Coop's bowl is served
  - qty: 1
    unit: 16-ounce package
    item: dumplings (Thai vegetable gyoza recommended)
    discrete: true
  - qty: 2
    unit: ''
    item: green onions, thinly sliced (green part only)

steps:
  - Bring the broth to a boil in a medium saucepan over high heat.
  - >-
    Add the carrot and cabbage and return to a boil, then lower the heat and
    simmer until tender, 5–10 minutes.
  - >-
    Stir in the soy sauce and sesame oil; taste and add more soy sauce if
    needed.
  - >-
    Drop the dumplings straight into the simmering broth and cook per the
    package directions, about 5 minutes. (The recipe cooks them separately —
    boiling them in the broth is easier and saves a pot.)
  - >-
    Ladle into bowls and top with green onions. Serve Coop's, then add
    sriracha to the rest to taste.

notes: |
  Ease: 6/6 (our rating, 1 = easiest).

  We boil the dumplings right in the broth to make it super easy.

  About 10–12 dumplings feeds the two of us, with the full 6 cups of broth.

  The only heat is the sriracha — leave it out of the pot and add it to bowls
  after Coop's is served.
