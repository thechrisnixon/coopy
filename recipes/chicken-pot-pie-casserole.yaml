name: Chicken Pot Pie Casserole
serves: 8
tags: [dinner, chicken, contains-dairy, postpartum-freezer]

time:
  prep: 20m
  cook: 40m
  total: 1h

sources:
  a:
    name: The Real Food Dietitians — Chicken Pot Pie Casserole
    url: https://therealfooddietitians.com/chicken-pot-pie-casserole/
    role: the whole recipe — a one-dish pot pie filling under cheddar drop biscuits

ingredients:
  - group: For the filling
    qty: ¼
    unit: cup
    item: unsalted butter
  - group: For the filling
    qty: 1
    unit: medium
    item: yellow onion, diced
    discrete: true
  - group: For the filling
    qty: 1
    unit: 16-oz bag
    item: frozen mixed vegetables (corn, carrots, peas, green beans)
    discrete: true
  - group: For the filling
    qty: ½ cup + 1 tablespoon
    unit: ''
    item: flour (gluten-free works)
  - group: For the filling
    qty: 4
    unit: cups
    item: low-sodium chicken broth
  - group: For the filling
    qty: 1
    unit: teaspoon
    item: fine salt
  - group: For the filling
    qty: ½
    unit: teaspoon
    item: dried thyme or dried parsley
  - group: For the filling
    qty: ½
    unit: teaspoon
    item: garlic powder
  - group: For the filling
    qty: ¼
    unit: teaspoon
    item: black pepper
  - group: For the filling
    qty: 1
    unit: lb
    item: chopped boneless skinless chicken breast or thighs
    note: raw or pre-cooked both work
  - group: For the biscuits
    qty: 2
    unit: cups
    item: flour (gluten-free works)
  - group: For the biscuits
    qty: 1
    unit: tablespoon
    item: baking powder
  - group: For the biscuits
    qty: 1
    unit: teaspoon
    item: garlic powder
  - group: For the biscuits
    qty: ½
    unit: teaspoon
    item: baking soda
  - group: For the biscuits
    qty: ¼
    unit: teaspoon
    item: fine salt
  - group: For the biscuits
    qty: 6
    unit: tablespoons
    item: cold unsalted butter
  - group: For the biscuits
    qty: 1
    unit: cup
    item: shredded cheddar cheese, divided
  - group: For the biscuits
    qty: 1½
    unit: teaspoons
    item: dried thyme or dried parsley
  - group: For the biscuits
    qty: 1
    unit: cup
    item: dairy or unsweetened non-dairy milk
  - group: For the biscuits
    qty: 1
    unit: teaspoon
    item: apple cider vinegar or white wine vinegar
  - group: For the biscuits
    item: flaky sea salt

steps:
  - >-
    Heat the oven to 400℉ and spray a 9×13-inch (3-quart) baking dish.
  - >-
    Melt the butter in a Dutch oven or large pot over medium-high. Cook the
    onion and frozen vegetables 5–6 minutes, until tender. Add the flour, toss
    to coat, and cook 1 minute more, stirring.
  - >-
    Turn the heat to low and add the broth a little at a time, stirring after
    each addition. Stir in the salt, thyme, garlic powder and pepper. Raise the
    heat to medium-high and boil 2–3 minutes until it thickens to a gravy.
  - >-
    Drop to medium-low, add the chicken and cook 5–7 minutes, until it turns
    opaque — it finishes in the oven. Spread in the baking dish and bake,
    uncovered, 10 minutes.
  - >-
    Meanwhile, whisk the 2 cups flour, baking powder, garlic powder, baking soda
    and salt. Cut in the cold butter until it looks like coarse crumbs. Stir in
    ¾ cup of the cheddar and the thyme, then the milk and vinegar, just until a
    soft, slightly sticky dough forms.
  - >-
    Pull the casserole out and drop the dough over the top in 1–2 tablespoon
    mounds. It doesn't need to be fully covered. Bake 15 minutes.
  - >-
    Scatter the remaining ¼ cup cheddar and the flaky salt over the biscuits and
    bake another 8–10 minutes, until browned.
  - Rest at least 10 minutes before serving; the gravy thickens as it cools.

notes: |
  Ease: 5/6 (our rating, 1 = easiest).

  On our postpartum freezer list. We portion it for lunches in small foil
  containers.

  Contains dairy (butter and cheddar in the biscuits).

  Leftovers keep, covered, in the fridge up to 4 days.
