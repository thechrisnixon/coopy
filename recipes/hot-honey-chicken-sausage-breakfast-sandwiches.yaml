steps:
  - >-
    Heat the oven to 350°F. Whisk the eggs with the milk, scallions, ½ tsp salt
    and some black pepper.
  - >-
    Line a rimmed baking sheet with parchment and grease it. Pour in the eggs
    and bake about 15 minutes, until fully set. Cut into circles with the rim
    of a glass, or into rectangles for less waste — leftover egg goes into
    burritos or to the baby.
  - >-
    Halve the English muffins, butter the cut sides, and bake 6–8 minutes until
    just lightly toasted.
  - >-
    In a large bowl, mix the ground chicken with the hot honey, garlic powder,
    onion powder, smoked paprika, 1 tsp salt and a pinch or two of pepper. Stop
    as soon as it's combined — don't overmix.
  - >-
    Coat a large skillet with olive oil over medium heat. Form ½-inch-thick
    patties the width of an English muffin (they shrink) and cook 5 minutes per
    side.
  - >-
    Assemble: cheese on one muffin half, then the sausage, the egg, and the
    other half.
  - >-
    To freeze, wrap each sandwich in plastic wrap and then foil, and bag them.
    Reheat in the toaster oven, about 8 minutes.

notes: |
  Makes 10 sandwiches — a postpartum freezer staple.

  The screenshot cuts off mid-sentence at the storage step ("wrap in parchment
  paper and place in freezer-safe bags…"). The wrap-and-reheat step above is
  from our postpartum freezer list, where the reheat time is still marked
  "8 mins?" — confirm it next time and update this.

  The hot honey is mild, but taste it before making Coop's.
