name: Hot Honey Chicken Sausage Breakfast Sandwiches
serves: 10
tags: [breakfast, chicken, freezes-well, postpartum-freezer, contains-dairy]

sources:
  a:
    name: Screenshot of a saved recipe
    role: the whole recipe — sheet-pan eggs, hot-honey chicken sausage, English muffins
  us:
    name: Our changes
    role: how we wrap, freeze and reheat them, from the postpartum freezer list

