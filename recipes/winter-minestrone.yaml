name: Winter Minestrone
serves: 8
tags: [dinner, soup, chicken, spicy]

time:
  cook: 45m
  total: 2h

sources:
  a:
    name: Epicurious — Winter Minestrone
    url: https://www.epicurious.com/recipes/food/views/winter-minestrone-351167
    role: the base — a long-cooked soffritto, browned tomato paste and a pot full of winter greens, no broth needed
  us:
    name: Our changes
    role: no pancetta or parmesan; spicy chicken sausage and a zucchini instead

ingredients:
  - qty: 3
    unit: medium
    item: red onions, chopped
    from: a
    discrete: true
  - qty: 4
    unit: ribs
    item: celery, chopped
    from: a
  - qty: 2
    unit: medium
    item: carrots, chopped
    from: a
  - qty: 1/3
    unit: cup
    item: extra-virgin olive oil
    from: a
    note: with no pancetta, this is all the fat in the soffritto
  - qty: 1
    unit: bunch
    item: Swiss chard, stems and leaves separated
    from: a
  - qty: 6
    unit: ''
    item: garlic cloves, finely chopped
    from: a
    discrete: true
  - qty: 1
    unit: teaspoon
    item: salt, plus more to taste
    from: a
  - qty: 3/4
    unit: teaspoon
    item: pepper
    from: a
  - qty: 2
    unit: tablespoons
    item: tomato paste
    from: a
  - qty: 1
    unit: 28-ounce can
    item: whole tomatoes in juice
    from: a
    discrete: true
  - qty: 3
    unit: quart
    item: hot water
    from: a
  - qty: 5
    unit: cups
    item: coarsely chopped cored Savoy cabbage (6 ounces)
    from: a
  - qty: 5
    unit: cups
    item: coarsely chopped escarole (1/2 pound)
    from: a
  - qty: 1
    unit: 19-ounce can
    item: cannellini beans, rinsed and drained
    from: a
    discrete: true
  - item: spicy chicken sausage, sliced
    from: us
    note: our addition instead of the pancetta — use mild for Coop's portion, or pull his before the sausage goes in; our call each time
  - qty: 1
    unit: ''
    item: zucchini, chopped
    from: us
    discrete: true
    note: our addition
  - group: To serve
    item: extra-virgin olive oil, for drizzling
    from: a
  - group: To serve
    item: cooked ditalini tossed with oil (optional)
    from: a

steps:
  - >-
    Brown the sausage in a splash of the oil in a wide 7- to 9-quart heavy pot
    over medium, then lift it out and set aside.
  - >-
    Add the rest of the oil, the onions, celery and carrots, and cook over
    medium, stirring now and then, while you prep the chard: cut out the stems
    and chop them, keeping the leaves separate.
  - >-
    Stir in the chard stems, garlic, salt and pepper. Keep cooking, stirring
    occasionally, until everything is very soft and starting to stick to the
    pot — about 45 minutes in all. This slow soffritto is where the flavor
    comes from.
  - >-
    Push the vegetables aside, add the tomato paste to the bare spot and cook,
    stirring, about 2 minutes until it starts to caramelize. Stir it through
    the vegetables and cook 2 minutes more without letting it burn.
  - >-
    Add the tomatoes and their juice, breaking them up, then the 3 quarts hot
    water, scraping up the browned bits.
  - >-
    Bring to a simmer, add the cabbage and escarole, cover and simmer about 40
    minutes, until the greens are tender.
  - >-
    Chop the chard leaves and stir them in with the beans, zucchini and browned
    sausage. Simmer, partly covered, 10 minutes. Season with salt and pepper.
    Stir in ditalini just before serving, if using.

notes: |
  We leave out the recipe's 1/3 pound pancetta, the Parmigiano-Reggiano rind
  and the grated parmesan to serve, and add spicy chicken sausage and a
  zucchini.

  The sausage is the only heat. Use mild sausage for Coop's portion, or pull
  his before the spicy sausage goes in — whichever suits that night.
