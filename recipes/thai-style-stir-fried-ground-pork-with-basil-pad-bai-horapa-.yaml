name: Thai-Style Stir-Fried Ground Pork with Basil (Pad Bai Horapa or Pad Ka-Prao)
serves: 4
tags:
  - Thai
  - stir-fry
  - wok
  - pork
  - quick
  - main
time:
  prep: 15 minutes active
  total: 15 minutes
sources:
  a:
    name: 'J. Kenji López-Alt, "The Wok: Recipes and Techniques" (via WBUR Here &
      Now)'
    url: https://www.wbur.org/hereandnow/2022/03/08/j-kenji-lopez-alt-wok-cookbook
    role: Excerpted recipe published with the Here & Now interview
ingredients:
  - qty: "6"
    item: medium garlic cloves, peeled (about 2 tablespoons/16 g)
    discrete: true
  - qty: "1"
    item: medium shallot (about 1½ ounces/45 g), peeled
    discrete: true
  - qty: 2 to 8
    item: Thai bird chiles, stems removed (⅛ to ½ ounce/4 to 15 g)
    note: see Notes
    discrete: true
  - qty: "2"
    unit: tablespoons
    item: peanut, rice bran, or other neutral oil (30 ml)
  - qty: "1"
    unit: pound
    item: lean ground pork, chicken, or beef or crumbled firm tofu (450 g)
    note: see Notes
  - qty: ⅓
    unit: pound
    item: green beans or long beans, cut into ½-inch pieces (150 g), optional
    note: see Notes
  - qty: "2"
    unit: tablespoons
    item: fish sauce (30 ml), plus more to taste
  - qty: "1"
    unit: teaspoon
    item: granulated sugar or palm sugar (4 g), more or less to taste
  - qty: "1"
    unit: tablespoon
    item: dark soy sauce (15 ml), optional
    note: see Notes
  - qty: "1"
    unit: tablespoon
    item: oyster sauce (15 ml), optional
    note: see Notes
  - qty: 1½
    unit: ounces
    item: fresh basil leaves (45 g; about 1½ cups packed)
    note: see Notes
  - item: kosher salt, a small pinch (for the mortar)
  - item: Steamed jasmine or short-grain rice
    group: To Serve
  - item: Nam Pla Prik (optional)
    group: To Serve
  - item: Extra-Crispy Fried Eggs (optional; page 114)
    group: To Serve
steps:
  - "If Using a Mortar and Pestle: Roughly chop the garlic, shallots, and chiles
    and place in the mortar. Add a small pinch of kosher salt. Pound with the
    pestle until roughly mashed (no need to form a paste here). If Not Using a
    Mortar and Pestle: Mince the garlic, shallots, and chiles by hand or in a
    minichopper."
  - Combine the oil and garlic/shallot/chile mixture in a wok or skillet and
    place over medium-high heat. Cook, stirring frequently, until the aromatics
    are lightly softened and the oil is fragrant, about 30 seconds after it
    starts sizzling.
  - Add the meat or tofu and cook, stirring and tossing while breaking it up
    with a spatula until no longer pink, about 2 minutes. Add the fish sauce,
    sugar, soy sauce (if using), and oyster sauce (if using). Continue to cook
    until most of the liquid is evaporated but the mixture is still nice and
    moist, about 1 minute.
  - Remove the wok or skillet from the heat. Add the basil and toss to combine
    until wilted. Serve immediately with rice, nam pla prik, and extra-crispy
    fried eggs.
notes: For best results, start with a whole piece of pork sirloin (or chicken
  breast, or firm tofu, or fish, or beef sirloin, or any lean meat really) and
  chop by hand. For easiest results, use ground meat from the supermarket. Two
  Thai bird chiles will be quite hot. Eight chiles will be blazing hot (have
  that cool, sweet, milky Thai iced tea handy!). For milder heat, replace the
  Thai bird chiles with half of a jalapeño or serrano chile. Beans are not a
  traditional addition to the stir-fry, but they can be delicious and are a nice
  way to break up the meatiness. If you want a more traditional version of the
  dish, omit the dark soy sauce and oyster sauce and season with more fish sauce
  to taste. For the most authentic results, look for holy basil at an Asian
  supermarket (bai ka-prao). Thai purple basil or plain old sweet Italian basil
  can be used in its place. A mortar and pestle will produce the most flavorful
  results, but you can easily make the dish without one. Excerpted from "The
  Wok" by J. Kenji López-Alt, copyright © 2022, republished with permission of
  W. W. Norton & Company.
