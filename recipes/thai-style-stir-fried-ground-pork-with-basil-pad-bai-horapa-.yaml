name: Thai-Style Stir-Fried Ground Pork with Basil (Pad Bai Horapa or Pad Ka-Prao)
serves: 4
tags:
  - Thai
  - stir-fry
  - wok
  - pork
  - quick
  - main
time:
  prep: 15 minutes active
  total: 15 minutes
sources:
  a:
    name: 'J. Kenji López-Alt, "The Wok: Recipes and Techniques" (via WBUR Here &
      Now)'
    url: https://www.wbur.org/hereandnow/2022/03/08/j-kenji-lopez-alt-wok-cookbook
    role: Excerpted recipe published with the Here & Now interview
ingredients:
  - qty: "6"
    item: medium garlic cloves, peeled (about 2 tablespoons)
    discrete: true
  - qty: "1"
    item: medium shallot, peeled
    discrete: true
  - qty: "2"
    unit: tablespoons
    item: peanut, rice bran, or other neutral oil
  - qty: "1"
    unit: pound
    item: lean ground pork, chicken, or beef or crumbled firm tofu
    note: Hand-chopped pork sirloin gives the best texture; supermarket ground meat is easiest.
  - qty: "1"
    unit: cup
    item: trimmed green beans, cut into ½-inch pieces (about ⅓ pound)
    note: Not traditional, but a nice way to break up the meatiness.
  - qty: "2"
    unit: tablespoons
    item: fish sauce, plus more to taste
  - qty: "1"
    unit: teaspoon
    item: granulated sugar or palm sugar, more or less to taste
  - qty: "1"
    unit: tablespoon
    item: dark soy sauce, optional
    note: Omit soy and oyster sauce (and season with more fish sauce) for a more traditional version.
  - qty: "1"
    unit: tablespoon
    item: oyster sauce, optional
    note: Omit for a more traditional fish-sauce-only seasoning.
  - qty: 1½
    unit: cups
    item: fresh basil leaves, packed
    note: Holy basil (bai ka-prao) is most authentic; Thai purple or sweet Italian basil also work.
  - item: kosher salt, a small pinch (for the mortar)
  - item: Steamed jasmine or short-grain rice
    group: To Serve
  - item: Nam Pla Prik (optional)
    group: To Serve
  - item: Extra-Crispy Fried Eggs (optional; page 114)
    group: To Serve
steps:
  - "Cut the trimmed green beans into ½-inch pieces. If Using a Mortar and
    Pestle: Roughly chop the garlic and shallot and place in the mortar. Add a
    small pinch of kosher salt. Pound with the pestle until roughly mashed (no
    need to form a paste here). If Not Using a Mortar and Pestle: Mince the
    garlic and shallot by hand or in a minichopper."
  - Combine the oil and garlic and shallot mixture in a wok or skillet and
    place over medium-high heat. Cook, stirring frequently, until the aromatics
    are lightly softened and the oil is fragrant, about 30 seconds after it
    starts sizzling.
  - Add the meat or tofu and cook, stirring and tossing while breaking it up
    with a spatula until no longer pink, about 2 minutes.
  - Add the green beans and cook, stirring and tossing, until bright green and
    crisp-tender, about 1 to 2 minutes. Add the fish sauce, sugar, soy sauce
    (if using), and oyster sauce (if using). Continue to cook until most of the
    liquid is evaporated but the mixture is still nice and moist, about 1
    minute.
  - Remove the wok or skillet from the heat. Add the basil and toss to combine
    until wilted. Serve immediately with rice, nam pla prik, and extra-crispy
    fried eggs.
notes: |
  For best results, start with a whole piece of pork sirloin (or chicken breast, or firm tofu, or fish, or beef sirloin, or any lean meat really) and chop by hand. For easiest results, use ground meat from the supermarket.

  Beans are not a traditional addition to the stir-fry, but they can be delicious and are a nice way to break up the meatiness.

  If you want a more traditional version of the dish, omit the dark soy sauce and oyster sauce and season with more fish sauce to taste.

  For the most authentic results, look for holy basil at an Asian supermarket (bai ka-prao). Thai purple basil or plain old sweet Italian basil can be used in its place.

  A mortar and pestle will produce the most flavorful results, but you can easily make the dish without one. Excerpted from "The Wok" by J. Kenji López-Alt, copyright © 2022, republished with permission of W. W. Norton & Company.
