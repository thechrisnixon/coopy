name: Mini Spinach & Cheese Pizza Rolls
tags: [coop, snack, contains-dairy, freezes-well]

time:
  prep: 10m
  cook: 18m
  total: 28m

sources:
  a:
    name: Yummy Toddler Food — Favorite Pizza Rolls (with Veggies)
    url: https://www.yummytoddlerfood.com/mini-spinach-and-cheese-pizza-rolls-recipe/
    role: the whole recipe — rolled pizza dough with spinach and cheese, baked in a muffin tin

ingredients:
  - qty: 13-16
    unit: ounces
    item: pizza dough, at room temperature
  - qty: ¾
    unit: cup
    item: pizza sauce
  - qty: 2
    unit: cups
    item: shredded mozzarella cheese
  - qty: 1
    unit: cup
    item: baby spinach, roughly chopped (or minced broccoli)
  - qty: ¼
    unit: cup
    item: grated Parmesan cheese

steps:
  - >-
    Heat the oven to 400°F. Grease a muffin tin very well, including the rim
    around each cup — the cheese bubbles over.
  - >-
    On a sheet of parchment, stretch the dough by hand into an 11×16-inch
    rectangle. If it springs back, let it rest 5 minutes and try again.
  - >-
    Spread on the sauce, then scatter the spinach, mozzarella and Parmesan.
    Roll up fairly tightly from a long side, using the parchment to help.
  - >-
    Cut into 12 even slices with a serrated knife — halve it, then halve each
    piece, and so on, for the most even slices.
  - >-
    Set one slice in each muffin cup and bake 22–26 minutes, until the dough is
    cooked through and the tops are golden.
  - >-
    Cool 3–5 minutes in the pan so the cheese firms up, then loosen with a
    knife if needed and lift out.

notes: |
  Makes 12 rolls.

  Keeps 3 days in the fridge, or up to 3 months in a freezer bag with the air
  pressed out. Microwave from frozen 30–60 seconds.

  The source lists 18 minutes of cook time but the method says 22–26 minutes
  in the oven — go by the method.
