# Minimal recipe: name + ingredients are the only required fields.
# The app hides every section that isn't here.

name: Grandma's Icebox Cookies
tags: [dessert, freezer]

ingredients:
  - qty: 1
    unit: cup
    item: butter, softened
  - qty: 2
    unit: cups
    item: brown sugar
  - qty: 2
    unit: ''
    item: eggs
    discrete: true
  - qty: 3.5
    unit: cups
    item: all-purpose flour
  - qty: 1
    unit: tsp
    item: baking soda
  - qty: 1
    unit: cup
    item: pecans, chopped
  - item: pinch of salt

notes: |
  Roll into logs, wrap, and freeze. Slice thin and bake at 375°F for 8 minutes
  straight from frozen — that's the entire point of them.
