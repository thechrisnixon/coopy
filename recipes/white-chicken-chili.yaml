name: White Chicken Chili
serves: 4
tags: [dinner, soup, chicken]

time:
  prep: 10m
  cook: 30m
  total: 40m

sources:
  a:
    name: Ambitious Kitchen — Healthy White Chicken Chili
    url: https://www.ambitiouskitchen.com/healthy-white-chicken-chili/
    role: the whole recipe — blended chickpeas thicken it instead of cream

ingredients:
  - qty: ½
    unit: tablespoon
    item: olive oil
  - qty: 1
    unit: medium
    item: white onion, chopped
    discrete: true
  - qty: 1
    unit: can
    item: mild green chiles (or 2 seeded, diced jalapeños)
    discrete: true
  - qty: 1
    unit: tablespoon
    item: ground cumin
  - qty: 2
    unit: teaspoons
    item: chili powder
  - qty: ¼
    unit: teaspoon
    item: coriander
  - qty: ¼
    unit: teaspoon
    item: dried oregano
  - qty: 4
    unit: cups
    item: low sodium chicken broth
  - qty: 2
    unit: (15 ounce) cans
    item: chickpeas, rinsed and drained
    discrete: true
  - qty: ¾
    unit: teaspoon
    item: salt, plus more to taste
  - item: freshly ground black pepper
  - qty: 1 ½
    unit: pounds
    item: boneless skinless chicken thighs (or breast)
  - qty: ½
    unit: cup
    item: frozen corn
  - qty: 1
    unit: medium
    item: lime, juiced
    discrete: true
  - qty: ⅓
    unit: cup
    item: fresh cilantro, chopped
  - group: For garnish
    item: tortilla strips or chips
  - group: For garnish
    item: extra cilantro
  - group: For garnish
    item: avocado slices
  - group: For garnish
    item: lime wedges

steps:
  - >-
    Heat the oil in a large Dutch oven over medium-high. Cook the onion and green
    chiles until soft, 3–4 minutes.
  - >-
    Stir in the cumin, chili powder, coriander and oregano for 30 seconds. Add the
    broth, one can of chickpeas, the raw chicken, salt and pepper, and simmer on
    medium-low for 20–30 minutes.
  - Lift out the chicken, shred it with two forks and return it to the pot with the lime juice and cilantro.
  - Blend the second can of chickpeas with ½ cup water until fairly smooth.
  - >-
    Stir the blended chickpeas and the corn into the pot and simmer 5–10 minutes
    more. Serve with the garnishes.

notes: |
  Our verdict: it was OK but missing something. The broth had good flavor, but
  it wasn't spicy at all and felt a bit thin on substance.

  To try next time:
  - more veg (it's just onion and chiles as written)
  - more corn
  - more heat — jalapeños instead of the mild chiles, or extra chili powder.
    If we do, pull Coop's portion before the extra heat goes in.
