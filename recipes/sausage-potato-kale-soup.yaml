name: Sausage, Potato & Kale Soup (Zuppa Toscana)
serves: 6
tags: [dinner, soup]

time:
  prep: 15m
  cook: 30m
  total: 45m

sources:
  a:
    name: All the Healthy Things — Dairy Free Zuppa Toscana Soup
    url: https://allthehealthythings.com/whole30-zuppa-toscana-soup-dairy-free-paleo/
    role: the base — Italian sausage, potatoes and kale in a coconut-milk broth
  us:
    name: Our changes
    role: no bacon, onion or garlic (the sausage carries it), plus a zucchini

ingredients:
  - qty: 1
    unit: pound
    item: Italian sausage
    from: a
    note: we skip the bacon, onion and garlic — the sausage has a ton of flavor on its own
  - qty: 1/2 – 1
    unit: teaspoon
    item: red pepper flakes
    from: a
  - qty: 2
    unit: teaspoon
    item: Italian seasoning
    from: a
  - qty: 1 1/2
    unit: teaspoon
    item: salt, plus more to taste
    from: a
  - qty: 1/8
    unit: teaspoon
    item: cracked black pepper, plus more to taste
    from: a
  - qty: 3
    unit: tablespoon
    item: arrowroot starch
    from: a
  - qty: 4
    unit: cups
    item: diced russet potatoes
    from: a
  - qty: 32
    unit: oz
    item: low sodium chicken broth
    from: a
  - qty: 1
    unit: ''
    item: zucchini, diced
    from: us
    discrete: true
    note: our addition — more veg in the pot
  - qty: 1
    unit: cup
    item: full-fat coconut milk
    from: a
    note: the recipe is already dairy-free — we keep this and just never add cream
  - qty: 4
    unit: cups
    item: curly kale
    from: a

steps:
  - >-
    Heat a large stockpot over medium. Add the sausage and brown it, breaking it
    up as it cooks.
  - >-
    Stir in the red pepper flakes, Italian seasoning, salt and pepper and cook a
    minute or two.
  - >-
    Sprinkle the arrowroot over the meat and stir to coat. Add the potatoes and
    broth, bring to a boil, then lower the heat and simmer about 30 minutes,
    until the potatoes are tender. Add the zucchini for the last 10 minutes or
    so.
  - >-
    Stir in the coconut milk and kale and simmer just until the kale wilts.
    Serve right away.

notes: |
  Ease: 1/6 (our rating, 1 = easiest).

  We leave out the recipe's 4 strips of bacon, 1 onion and 6 cloves of garlic
  — the sausage has a ton of flavor and doesn't need them — and add a zucchini.
  No dairy: the coconut milk stays (it isn't dairy), we just don't add cream.

  The red pepper flakes are the only added heat; use the low end if Coop is
  eating it.

  Reheats well for lunch.
