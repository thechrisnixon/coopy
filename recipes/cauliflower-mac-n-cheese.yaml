name: Cauliflower Mac n Cheese
serves: 4
tags: [coop, dinner, contains-dairy]

time:
  prep: 10m
  cook: 15m

sources:
  a:
    name: Real Little Meals — Cauliflower Mac N Cheese
    url: https://reallittlemeals.com/post/cauliflower-mac-n-cheese/
    role: the whole recipe, a cheese sauce thickened with blended cauliflower

ingredients:
  - qty: 8
    unit: oz
    item: elbow pasta
  - qty: 2
    unit: cups
    item: cauliflower
  - qty: 1 1/4
    unit: cups
    item: milk
    note: split — 1/2 cup goes into the cauliflower purée, 3/4 cup into the sauce
  - qty: 1 1/2
    unit: cup
    item: cheddar cheese
  - qty: 2
    unit: tbsp
    item: butter
  - qty: 1
    unit: tbsp
    item: flour
  - qty: 1
    unit: tsp
    item: garlic powder
  - qty: 1
    unit: tsp
    item: dijon mustard
  - item: salt and pepper, to taste

steps:
  - Cook the pasta according to the package directions.
  - Steam the cauliflower.
  - Blend the steamed cauliflower with 1/2 cup of the milk until smooth.
  - >-
    Melt the butter in a large pot over medium heat, add the flour, and whisk
    into a roux. Whisk in the remaining 3/4 cup milk and bring to a boil.
  - >-
    Turn the heat to low and stir in the cheese, cauliflower purée, garlic
    powder, dijon, salt and pepper until the cheese has melted.
  - Toss the sauce with the cooked pasta.

notes: |
  Leftovers keep in an airtight container in the fridge for 2-3 days. Reheat on
  the stovetop or in the microwave.
