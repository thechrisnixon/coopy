name: Braised Short Rib Pappardelle
serves: 10
tags: [dinner, beef, pasta, freezes-well, contains-dairy, special, postpartum-freezer]

time:
  prep: 25m
  cook: 3h
  total: 3h 30m

sources:
  a:
    name: Plays Well With Butter — Slowly Braised Beef Short Rib Ragu
    url: https://playswellwithbutter.com/short-rib-ragu-recipe/
    role: the whole recipe — short ribs braised into a ragu, finished with cream and parmesan

ingredients:
  - group: For the short rib ragu
    qty: 4
    unit: pounds
    item: English cut beef short ribs
  - group: For the short rib ragu
    qty: 3
    unit: tablespoons
    item: olive oil, divided
  - group: For the short rib ragu
    qty: 3
    unit: large
    item: carrots, peeled and diced
    discrete: true
  - group: For the short rib ragu
    qty: 1
    unit: large
    item: yellow onion, finely diced
    discrete: true
  - group: For the short rib ragu
    qty: 1
    unit: stalk
    item: celery, finely diced
    discrete: true
  - group: For the short rib ragu
    qty: 8
    unit: cloves
    item: garlic, finely chopped or grated
    discrete: true
  - group: For the short rib ragu
    qty: 6
    unit: ounces
    item: tomato paste
  - group: For the short rib ragu
    qty: 1
    unit: cup
    item: dry red wine
  - group: For the short rib ragu
    qty: 1
    unit: 0.75-ounce package
    item: fresh "poultry herb blend" (or about 2 sprigs rosemary, 4 sprigs sage and 12 sprigs thyme)
    discrete: true
  - group: For the short rib ragu
    qty: 2
    item: bay leaves
    discrete: true
  - group: For the short rib ragu
    qty: 1
    item: parmesan rind (optional)
    discrete: true
  - group: For the short rib ragu
    qty: 14
    unit: ounces
    item: crushed tomatoes
  - group: For the short rib ragu
    qty: 2
    unit: cups
    item: low-sodium beef broth/stock or water
  - group: For the short rib ragu
    item: kosher salt and ground black pepper, to season

  - group: For the pasta
    qty: 24
    unit: ounces
    item: pappardelle or pasta of choice
  - group: For the pasta
    qty: ½
    unit: cup
    item: heavy cream
  - group: For the pasta
    qty: ½
    unit: cup
    item: grated parmesan
  - group: For the pasta
    item: to serve — grated parmesan, chopped fresh herbs, as desired

steps:
  - >-
    Pat the short ribs dry and season with a heaping tablespoon of kosher salt and
    pepper. Heat oil in a large heavy pot over medium-high and brown the ribs in
    batches, 3–4 minutes per side. Set aside and pour off all but 2 tablespoons
    of fat.
  - >-
    Over medium, add the carrots, onion and celery with 1 teaspoon salt and some
    pepper and cook, stirring now and then, until deeply browned, 15–20 minutes.
  - >-
    Add the garlic and stir 1–2 minutes until fragrant, then the tomato paste for
    2–3 minutes until it darkens.
  - >-
    Raise the heat to medium-high, pour in the wine and scrape up the browned
    bits. Cook 3–4 minutes until almost all absorbed.
  - >-
    Tie the herbs with twine and add them with the bay leaves and parmesan rind.
    Add the crushed tomatoes, broth and short ribs. Bring to a boil, then cover
    and simmer on low, stirring occasionally, 2½–3 hours until the meat falls
    apart. Add a splash of water and lower the heat if it reduces too fast.
  - >-
    Lift out the ribs, discard the herbs, bay leaves and rind, shred the meat off
    the bones, and stir it back in. The ragu can be cooled and stored at this
    point.
  - >-
    To serve, cook the pasta in salted water until al dente, saving about 1 cup
    of pasta water; don't rinse. Meanwhile bring the ragu to a simmer and stir in
    the cream and parmesan over low.
  - >-
    Toss the pasta into the ragu over medium for 1–2 minutes, loosening with pasta
    water or tightening with more parmesan. Serve topped with parmesan and herbs.

notes: |
  A special-occasion dinner. The braised short rib ragu is also on our
  postpartum freezer list — freeze it after shredding the meat back in, before
  the cream and parmesan, and finish it with the pasta on the day.

  The source serves 10–12.
