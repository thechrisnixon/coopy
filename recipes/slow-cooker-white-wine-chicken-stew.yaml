name: Slow Cooker White Wine Chicken Stew
serves: 4
tags: [dinner, slow-cooker, chicken]

time:
  prep: 20m
  cook: 7h 15m
  total: 7h 35m

sources:
  a:
    name: Ambitious Kitchen — Slow Cooker White Wine Chicken Stew
    url: https://www.ambitiouskitchen.com/slow-cooker-white-wine-chicken-stew/
    role: the whole recipe — seared chicken thighs and vegetables in a white wine and herb broth

ingredients:
  - qty: 1
    unit: tablespoon
    item: olive oil
  - qty: 1½
    unit: pounds
    item: boneless skinless chicken thighs, cut into 1 inch pieces
  - item: freshly ground salt and pepper
  - qty: 2
    unit: cups
    item: chicken broth
  - qty: ½
    unit: cup
    item: dry white wine
  - qty: 1
    unit: tablespoon
    item: worcestershire sauce
  - qty: 1
    unit: teaspoon
    item: balsamic vinegar
  - qty: 2
    unit: teaspoons
    item: chopped fresh rosemary
  - qty: 2
    unit: teaspoons
    item: chopped fresh thyme
  - qty: ½
    unit: teaspoon
    item: dried oregano
  - qty: 1
    unit: teaspoon
    item: salt, plus more to taste
  - item: lots of freshly ground black pepper
  - qty: 6
    unit: ''
    item: garlic cloves, finely minced
    discrete: true
  - qty: 1
    unit: large
    item: yellow onion, cut into chunks
    discrete: true
  - qty: 3
    unit: large
    item: carrots, peeled and cut into ½-inch diagonal slices
  - qty: 1
    unit: pound
    item: yukon gold potatoes, diced into ½ inch cubes
  - qty: ¼
    unit: cup
    item: all purpose flour (or gluten-free substitute)
  - qty: ½
    unit: cup
    item: unsweetened almond milk
  - qty: ⅔
    unit: cup
    item: frozen peas

steps:
  - >-
    Heat the oil in a large skillet over high heat. Season the chicken with salt
    and pepper and sear 5–6 minutes, just to brown it — it doesn't need to cook
    through. Move it to the slow cooker.
  - >-
    Add the broth, wine, Worcestershire, vinegar, rosemary, thyme, oregano,
    salt, pepper, garlic, onion, carrots and potatoes. Stir, cover, and cook on
    low 7–8 hours or high 4–5 hours.
  - >-
    Ladle ½ cup of the broth into a bowl and whisk in the almond milk and flour
    until smooth. Stir it back into the slow cooker with the peas and cook
    uncovered on high 15–20 minutes, until thickened. Season to taste.

