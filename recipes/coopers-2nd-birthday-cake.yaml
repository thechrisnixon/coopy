name: Cooper's 2nd Birthday Cake (Strawberry Chantilly)
serves: 12
tags: [dessert, baking, special, birthday, contains-dairy]

time:
  prep: 45m
  cook: 30m
  total: 2h 15m

sources:
  a:
    name: Sugar Geek Show — Berry Chantilly Cake
    url: https://sugargeekshow.com/berry-chantilly-cake/
    role: the whole cake — vanilla layers, berry filling, mascarpone chantilly cream

ingredients:
  - group: Vanilla cake
    qty: 13
    unit: ounces
    item: bleached cake flour
  - group: Vanilla cake
    qty: 13
    unit: ounces
    item: granulated sugar
  - group: Vanilla cake
    qty: 3
    unit: teaspoon
    item: baking powder
  - group: Vanilla cake
    qty: 1/4
    unit: teaspoon
    item: baking soda
  - group: Vanilla cake
    qty: 1/2
    unit: teaspoon
    item: salt
  - group: Vanilla cake
    qty: 8
    unit: ounces
    item: unsalted butter, softened
  - group: Vanilla cake
    qty: 2
    unit: teaspoons
    item: vanilla extract
  - group: Vanilla cake
    qty: 1
    unit: teaspoon
    item: almond extract
  - group: Vanilla cake
    qty: 10
    unit: ounces
    item: whole milk, room temperature
  - group: Vanilla cake
    qty: 3
    unit: ounces
    item: vegetable oil
  - group: Vanilla cake
    qty: 3
    unit: large
    item: eggs, room temperature
    discrete: true

  - group: Chantilly cream
    qty: 16
    unit: ounces
    item: cream cheese, softened
  - group: Chantilly cream
    qty: 8
    unit: ounces
    item: unsalted butter, softened
  - group: Chantilly cream
    qty: 8
    unit: ounces
    item: mascarpone, softened
  - group: Chantilly cream
    qty: 22
    unit: ounces
    item: powdered sugar, sifted
  - group: Chantilly cream
    qty: 1
    unit: teaspoon
    item: almond extract
  - group: Chantilly cream
    qty: 1
    unit: Tablespoon
    item: vanilla extract
  - group: Chantilly cream
    qty: 16
    unit: ounces
    item: heavy whipping cream

  - group: Berry filling
    qty: 2
    unit: cups
    item: fresh or frozen berries
    note: we use strawberries
  - group: Berry filling
    qty: 2.5
    unit: ounces
    item: sugar
  - group: Berry filling
    qty: 1
    unit: ounces
    item: cold water
  - group: Berry filling
    qty: 1
    unit: ounces
    item: cornstarch
  - group: Berry filling
    qty: 2
    unit: teaspoons
    item: lemon juice

  - group: To decorate
    qty: 2
    unit: cups
    item: fresh berries

steps:
  - >-
    Cake: bring every cold ingredient to room temperature first — it matters.
    Heat the oven to 350°F and prepare three 8-inch pans.
  - >-
    Combine 4 oz of the milk with the oil. Separately, whisk the other 6 oz
    milk with the vanilla, almond extract and eggs.
  - >-
    In a stand mixer with the paddle, mix the flour, sugar, baking powder,
    baking soda and salt. On the lowest speed, add the butter in small pieces
    until it looks like coarse sand.
  - >-
    Add the milk-and-oil all at once and beat on medium for a full 2 minutes.
    Then, on low, add the egg mixture in three additions, scraping between,
    just until combined.
  - >-
    Divide among the pans and bake 25–35 minutes, until a toothpick comes out
    clean. Tap each pan once on the counter straight out of the oven. Cool 20
    minutes in the pans, turn out, wrap, and freeze at least 1 hour.
  - >-
    Filling: simmer the berries with the sugar. Whisk the cornstarch into the
    cold water, stir it into the bubbling berries with the lemon juice, and
    cook 1–2 minutes until thick and glossy. Cool completely (spread on a
    sheet pan to speed it up).
  - >-
    Chantilly cream: beat the cream cheese, butter and mascarpone until smooth,
    then beat in the powdered sugar. In a clean bowl, whip the cream to soft
    peaks with the vanilla and almond extract — watch it, it goes fast. Fold
    the cream into the cheese mixture just until combined.
  - >-
    Assemble: level the chilled layers. Layer cake, berry filling, cream and
    fresh berries; repeat; top with the third layer. Crumb-coat and freeze 15
    minutes, then frost the outside and smooth with a bench scraper.
  - >-
    Pile fresh berries on top and chill at least 30 minutes. Serve cold, or let
    it sit 15–20 minutes first for the best flavor.

notes: |
  The cake Cooper had for his 2nd birthday, made with strawberries.

  Start the day before, or at least the morning of: the layers have to cool
  and freeze before assembly.

  Heavy on dairy: cream cheese, mascarpone, butter and cream.
