name: Pumpkin Cottage Cheese Pancakes
serves: 2
tags: [coop, breakfast, pancakes, contains-dairy]

time:
  prep: 5m
  cook: 10m
  total: 15m

sources:
  a:
    name: Laura Fuentes — Cottage Cheese Pumpkin Pancakes
    url: https://www.laurafuentes.com/cottage-cheese-pumpkin-pancakes/
    role: the whole recipe — a thick, high-protein blender batter of cottage cheese, pumpkin and oats

ingredients:
  - qty: 1/2
    unit: cup
    item: cottage cheese
  - qty: 1/2
    unit: cup
    item: pumpkin puree
  - qty: 2
    unit: large
    item: eggs
    discrete: true
  - qty: 1
    unit: teaspoon
    item: vanilla (optional)
  - qty: 2
    unit: teaspoons
    item: baking powder (aluminum free)
  - qty: 1
    unit: teaspoon
    item: pumpkin spice
  - qty: 1
    unit: cup
    item: old-fashioned oats
  - item: butter or oil, for the pan

steps:
  - >-
    Add the cottage cheese, pumpkin, eggs, vanilla, baking powder, pumpkin spice
    and oats to a blender in that order. Blend on high a full minute, until
    smooth. The batter is very thick — don't thin it.
  - >-
    Heat a nonstick griddle or large pan over medium-high and grease it. Scoop
    ¼ cup of batter per pancake and spread it out with the back of the scoop.
  - >-
    Cook 2 minutes, until the edges look set and a few bubbles appear, then
    flip once and cook 2 minutes more. Don't press them down or they go dense.
  - Serve with your favorite toppings.
