name: Lamb Kofta Kebabs
serves: 4
tags: [dinner, lamb, beef, special]

time:
  prep: 16m
  cook: 9m
  total: 25m

sources:
  a:
    name: Healthy Seasonal Recipes — Grilled Lamb Kofta Kebabs
    url: https://www.healthyseasonalrecipes.com/grilled-lamb-kofta-kebabs/
    role: the whole recipe — warm-spiced kofta with parsley, cinnamon and allspice
  us:
    name: Our changes
    role: half beef, half lamb, and a 1½× batch

ingredients:
  - qty: 1
    unit: pound
    item: ground lamb and ground beef, mixed
    from: us
    note: the source is all lean lamb (beef as a sub) — we do part beef, part lamb
  - qty: 1
    unit: medium
    item: Spanish onion, minced
    from: a
    discrete: true
  - qty: 1
    unit: clove
    item: garlic, minced
    from: a
    discrete: true
  - qty: 1/4
    unit: cup
    item: curly parsley, finely chopped
    from: a
  - qty: 1/2
    unit: teaspoon
    item: salt
    from: a
  - qty: 1/4
    unit: teaspoon
    item: ground pepper
    from: a
  - qty: 1/4
    unit: teaspoon
    item: cinnamon
    from: a
  - qty: 1/4
    unit: teaspoon
    item: allspice
    from: a
  - qty: 1/8
    unit: teaspoon
    item: ground cloves
    from: a

steps:
  - >-
    Heat the grill to medium-high. Knead the meat with the onion, garlic,
    parsley, salt, pepper, cinnamon, allspice and cloves until the seasoning is
    evenly through it.
  - >-
    Divide into 4 portions (6 for our 1½× batch) and shape each into an
    8-inch sausage around a heavy metal skewer.
  - >-
    Right before the meat goes on, oil the grate with a paper towel soaked in
    oil and held in tongs.
  - >-
    Grill, turning every 3–4 minutes, until cooked through, 9–13 minutes. Rest
    4 minutes before sliding off the skewers.

notes: |
  We make it 1½× (1½ lb meat, part beef and part lamb) for 6 kebabs, which is
  enough for 4 meals. Use the 1.5× scaler.
