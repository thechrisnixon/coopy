name: Edamame Salad with Peanut Sauce
serves: 6
tags: [lunch, salad, make-ahead]

time:
  prep: 20m
  total: 20m

sources:
  a:
    name: Nora Cooks — Edamame Salad with Peanut Sauce
    url: https://www.noracooks.com/edamame-salad/
    role: the whole recipe — edamame, crunchy vegetables and a peanut-maple dressing

ingredients:
  - group: Salad
    qty: 16
    unit: ounces
    item: frozen shelled edamame
  - group: Salad
    qty: 1
    unit: cup
    item: red cabbage, shredded
  - group: Salad
    qty: 1
    unit: cup
    item: carrots, shredded
  - group: Salad
    qty: 1/2
    unit: cup
    item: green onions, chopped
  - group: Salad
    qty: 2
    unit: cups
    item: kale, chopped
  - group: Salad
    qty: 1/4
    unit: cup
    item: cilantro, chopped (optional)
  - group: Salad
    qty: 1/2
    unit: cup
    item: peanuts (or cashews), chopped

  - group: Peanut sauce
    qty: 6
    unit: tablespoons
    item: creamy peanut butter
  - group: Peanut sauce
    qty: 3
    unit: tablespoons
    item: seasoned rice vinegar
  - group: Peanut sauce
    qty: 3
    unit: tablespoons
    item: low-sodium soy sauce
  - group: Peanut sauce
    qty: 3
    unit: tablespoons
    item: pure maple syrup
  - group: Peanut sauce
    qty: 1
    unit: teaspoon
    item: toasted sesame oil
  - group: Peanut sauce
    qty: 1/4
    unit: teaspoon
    item: ground ginger
  - group: Peanut sauce
    qty: 1
    unit: teaspoon
    item: Sriracha (or to taste)
    note: we leave it out of the sauce so it works for Coop — Sriracha on the side

steps:
  - Cook or thaw the edamame per the package, then rinse under cold water.
  - Put the edamame in a large bowl with the rest of the salad ingredients.
  - >-
    Whisk the sauce ingredients until smooth, adding a splash of warm water if
    it's too thick.
  - Pour the sauce over the salad and toss well.
  - >-
    Top with extra chopped nuts if you like. It's best chilled for at least an
    hour before serving.

notes: |
  Makes a good make-ahead lunch: it keeps in the fridge for a few days.
