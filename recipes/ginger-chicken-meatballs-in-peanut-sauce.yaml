name: Ginger Chicken Meatballs in Peanut Sauce
serves: 4
tags: [dinner, chicken, spicy]

time:
  prep: 30m
  cook: 30m
  total: 1h

sources:
  a:
    name: Ambitious Kitchen — One Pan Ginger Chicken Meatballs with Peanut Sauce
    url: https://www.ambitiouskitchen.com/one-pan-ginger-chicken-meatballs-with-peanut-sauce/
    role: the whole recipe — meatballs simmered in coconut peanut sauce in one pan

ingredients:
  - group: For the meatballs
    qty: 1
    unit: pound
    item: 93% lean ground chicken (or lean ground turkey)
  - group: For the meatballs
    qty: 1
    item: egg
    discrete: true
  - group: For the meatballs
    qty: ½
    unit: cup
    item: panko breadcrumbs (or 2 tablespoons coconut flour for GF)
  - group: For the meatballs
    qty: 1/4
    unit: cup
    item: green onion, finely chopped
  - group: For the meatballs
    qty: ¼
    unit: cup
    item: cilantro, finely diced
  - group: For the meatballs
    qty: 1
    item: jalapeño, seeded and finely diced
    discrete: true
  - group: For the meatballs
    qty: 3
    unit: cloves
    item: garlic, minced
    discrete: true
  - group: For the meatballs
    qty: 1
    unit: tablespoon
    item: fresh ginger, grated
  - group: For the meatballs
    qty: ¼
    unit: teaspoon
    item: cayenne pepper
  - group: For the meatballs
    qty: 1/2
    unit: teaspoon
    item: salt
  - group: For the meatballs
    item: freshly ground black pepper
  - group: For the meatballs
    qty: 1
    unit: tablespoon
    item: toasted sesame oil (or avocado, coconut or olive oil)

  - group: For the peanut sauce
    qty: 1
    unit: (15 ounce) can
    item: light coconut milk
    discrete: true
  - group: For the peanut sauce
    qty: 1/2
    unit: cup
    item: creamy natural peanut butter
  - group: For the peanut sauce
    qty: 2
    unit: tablespoons
    item: gluten free soy sauce (or coconut aminos)
  - group: For the peanut sauce
    qty: 1
    unit: tablespoon
    item: chili paste or sriracha

  - group: Add-ins
    qty: 2
    unit: large
    item: carrots, thinly sliced
    discrete: true
  - group: Add-ins
    qty: 1
    item: red bell pepper, julienned
    discrete: true
  - group: Add-ins
    qty: 2/3
    unit: cup
    item: frozen peas (or edamame)

  - group: To garnish
    item: chopped honey roasted peanuts
  - group: To garnish
    item: diced scallions
  - group: To garnish
    item: fresh cilantro
  - group: To garnish
    item: hot sauce, if desired

steps:
  - >-
    Mix the chicken, egg, panko, green onion, cilantro, jalapeño, garlic, ginger,
    cayenne, salt and pepper by hand and roll into 16 golf-ball-sized meatballs.
  - >-
    Heat the sesame oil in a large deep skillet over medium-high and brown the
    meatballs on all sides, 5–6 minutes total, in batches if needed. Set aside.
  - >-
    Lower the heat to medium-low and whisk the coconut milk, peanut butter, soy
    sauce and chili paste together in the same pan. Add the carrots and the
    meatballs and bring to a simmer, then cover, turn to low and cook 15 minutes.
  - >-
    Uncover, gently stir in the peas and bell pepper, and simmer 5 minutes more.
    Serve over brown rice, quinoa or zucchini noodles, topped with peanuts,
    scallions and cilantro.

notes: |
  Rich but good. There's plenty of sauce.

  For Coop: the heat is in both the meatballs (jalapeño, cayenne) and the sauce
  (chili paste). Hold back a little of the meat before the jalapeño and cayenne
  go in for his meatballs, and set aside some sauce before the chili paste is
  whisked in to simmer them in.
